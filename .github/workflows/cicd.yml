name: SIMOPRAM CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/tests.yml

  deploy:
    name: Deploy to VPS
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: simopram-deploy-staging
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      APP_DIR: ${{ secrets.STAGING_APP_DIR }}
      RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release
        uses: actions/download-artifact@v7
        with:
          name: simopram-release

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?Set STAGING_SSH_PRIVATE_KEY}"
          : "${SSH_HOST:?Set STAGING_SSH_HOST}"
          : "${SSH_USER:?Set STAGING_SSH_USER}"
          : "${APP_DIR:?Set STAGING_APP_DIR}"
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "${SSH_PORT:-22}" =~ ^[0-9]+$ ]]
          [[ "$APP_DIR" =~ ^/[a-zA-Z0-9_./-]+$ && "$APP_DIR" != "/" ]]
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -p "${SSH_PORT:-22}" "$SSH_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Upload release
        run: |
          scp -o BatchMode=yes -o ConnectTimeout=15 -P "${SSH_PORT:-22}" \
            simopram-release.tar.gz \
            "${SSH_USER}@${SSH_HOST}:/tmp/simopram-${RELEASE_ID}.tar.gz"

      - name: Activate release
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" \
            "APP_DIR='$APP_DIR' ARCHIVE='/tmp/simopram-${RELEASE_ID}.tar.gz' RELEASE_ID='$RELEASE_ID' bash -s" < scripts/deploy.sh

      - name: Remove local SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
