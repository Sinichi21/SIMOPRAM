name: tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, intl, pdo_mysql, pdo_sqlite, sqlite3, xml, curl, zip, gd
          tools: composer:v2
          coverage: none

      - name: Validate Composer files
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: cp .env.example .env

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Check PHP formatting
        run: composer lint:check

      - name: Run tests
        run: php artisan test --compact

      - name: Test deployment scripts
        run: bash scripts/test-deploy.sh

      - name: Install production dependencies
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress --no-scripts

      - name: Package release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: bash scripts/package-release.sh "$RUNNER_TEMP/simopram-release.tar.gz"

      - name: Upload release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: simopram-release
          path: ${{ runner.temp }}/simopram-release.tar.gz
          if-no-files-found: error
          retention-days: 7
