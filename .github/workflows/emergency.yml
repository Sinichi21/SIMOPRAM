name: Emergency Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emergency-deploy:
    name: Emergency Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, intl, pdo_mysql, xml, curl, zip
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Create release archive
        run: |
          mkdir -p release

          rsync -a ./ release/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='release'

          tar -czf simopram-release.tar.gz -C release .

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan \
            -p "${SSH_PORT:-22}" \
            "$SSH_HOST" \
            >> ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          ssh \
            -p "${SSH_PORT:-22}" \
            "${SSH_USER}@${SSH_HOST}" \
            "whoami && hostname && pwd"

      - name: Upload release
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          scp \
            -P "${SSH_PORT:-22}" \
            simopram-release.tar.gz \
            "${SSH_USER}@${SSH_HOST}:/tmp/simopram-release.tar.gz"

      - name: Upload deploy script
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          scp \
            -P "${SSH_PORT:-22}" \
            scripts/deploy.sh \
            "${SSH_USER}@${SSH_HOST}:/tmp/simopram-deploy.sh"

      - name: Deploy release
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          APP_DIR: ${{ secrets.STAGING_APP_DIR }}
        run: |
          ssh \
            -p "${SSH_PORT:-22}" \
            "${SSH_USER}@${SSH_HOST}" \
            "chmod +x /tmp/simopram-deploy.sh && \
             APP_DIR='${APP_DIR}' \
             /tmp/simopram-deploy.sh"
